<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102A43" />
  <meta name="description" content="Aplikasi nota ringkas untuk Almers Food." />
  <title>Nota Almers Food</title>
  <style>
:root {
  --navy: #102a43;
  --navy-soft: #243b53;
  --coral: #ef5b4d;
  --coral-dark: #d94539;
  --yellow: #f4bd32;
  --cream: #fbf8f2;
  --paper: #fffdf8;
  --ink: #1f2933;
  --muted: #829ab1;
  --line: #d9e2ec;
  --soft: #f0f4f7;
  --shadow: 0 18px 50px rgba(16, 42, 67, 0.1);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: #f4f1eb;
  font-synthesis: none;
}

* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; background: #f4f1eb; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }

.app-shell { min-height: 100vh; padding: 26px 34px 42px; }
.topbar { max-width: 1380px; margin: 0 auto 28px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.brand-lockup { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; background: var(--navy); color: white; font-weight: 900; letter-spacing: -0.08em; box-shadow: 5px 5px 0 var(--yellow); }
.eyebrow { margin: 0 0 5px; font-size: 10px; line-height: 1; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--coral); }
.topbar h1 { margin: 0; color: var(--navy); font-size: 20px; letter-spacing: -0.04em; }
.topbar-actions { display: flex; align-items: center; gap: 14px; }
.status-pill, .paper-size { display: inline-flex; align-items: center; gap: 8px; padding: 8px 11px; border: 1px solid #dbe5e9; border-radius: 999px; color: var(--navy-soft); background: rgba(255,255,255,.56); font-size: 11px; font-weight: 700; }
.status-dot { width: 7px; height: 7px; border-radius: 99px; background: #42b883; box-shadow: 0 0 0 4px rgba(66,184,131,.14); }
.ghost-button, .secondary-button, .small-button, .primary-button { border: 0; border-radius: 12px; font-weight: 800; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
.ghost-button { padding: 10px 13px; background: transparent; color: var(--navy); border: 1px solid var(--line); }
.ghost-button:hover, .secondary-button:hover, .small-button:hover, .primary-button:hover { transform: translateY(-2px); }

.workspace { max-width: 1380px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(340px, .72fr); align-items: start; gap: 28px; }
.editor-panel, .preview-stage { border: 1px solid rgba(16,42,67,.08); border-radius: 24px; box-shadow: var(--shadow); }
.editor-panel { padding: 28px; background: rgba(255,255,255,.82); }
.panel-heading { display: flex; justify-content: space-between; gap: 22px; align-items: flex-start; margin-bottom: 28px; }
.panel-heading h2, .preview-toolbar h2 { margin: 0; color: var(--navy); font-size: clamp(24px, 3vw, 34px); line-height: 1.05; letter-spacing: -0.055em; }
.muted { margin: 9px 0 0; color: var(--muted); font-size: 13px; }
.total-beacon { flex: 0 0 auto; min-width: 132px; padding: 13px 15px; border: 1px solid #f4d46e; border-radius: 17px; background: #fff7dc; text-align: right; }
.total-beacon span { display: block; color: #9a6d00; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.total-beacon strong { display: block; margin-top: 4px; color: var(--navy); font-size: 19px; letter-spacing: -.04em; }
.form-section { padding: 22px 0; border-top: 1px dashed #ccd7df; }
.form-section:first-of-type { border-top: 0; padding-top: 0; }
.compact-section { padding-bottom: 0; }
.section-title { display: flex; align-items: flex-start; gap: 11px; }
.section-title-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.section-number { display: grid; place-items: center; flex: 0 0 27px; height: 27px; border-radius: 9px; background: var(--navy); color: white; font: 800 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
.section-title h3 { margin: 1px 0 4px; color: var(--navy); font-size: 14px; letter-spacing: -.015em; }
.section-title p { margin: 0; color: var(--muted); font-size: 11px; }
.form-grid { display: grid; gap: 13px; margin-top: 16px; }
.two-col { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.three-col { grid-template-columns: repeat(3, minmax(0, 1fr)); }
label { display: flex; flex-direction: column; gap: 7px; color: var(--navy-soft); font-size: 11px; font-weight: 800; }
input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 11px; outline: none; background: white; color: var(--ink); padding: 11px 12px; font-size: 13px; font-weight: 600; transition: border .18s ease, box-shadow .18s ease; }
input:focus, textarea:focus { border-color: var(--coral); box-shadow: 0 0 0 4px rgba(239,91,77,.1); }
input::placeholder, textarea::placeholder { color: #a5b4c0; font-weight: 500; }
textarea { resize: vertical; line-height: 1.4; }
.small-button { padding: 9px 12px; background: var(--navy); color: white; font-size: 11px; white-space: nowrap; }
.items-table-head, .item-row { display: grid; grid-template-columns: minmax(140px, 1.7fr) 68px minmax(100px, 1fr) minmax(94px, 1fr) 28px; gap: 9px; align-items: center; }
.items-table-head { margin: 20px 0 8px; padding: 0 10px; color: #8da1b2; font-size: 9px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
.items-list { display: grid; gap: 8px; }
.item-row { padding: 7px; border: 1px solid #e5ebef; border-radius: 13px; background: var(--soft); }
.item-row input { padding: 9px 10px; font-size: 12px; }
.item-row output { padding-left: 4px; color: var(--navy); font: 800 11px ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; }
.remove-button { width: 26px; height: 26px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; color: #a3b0bb; background: transparent; font-size: 20px; line-height: 1; }
.remove-button:hover { background: #fee7e4; color: var(--coral-dark); }
.payment-hint { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #f2f7f8; color: #637d8d; font-size: 11px; }
.action-row { display: flex; justify-content: flex-end; gap: 10px; padding-top: 24px; }
.secondary-button { padding: 12px 15px; color: var(--navy); background: #edf2f5; font-size: 12px; }
.primary-button { display: inline-flex; align-items: center; gap: 14px; padding: 12px 14px 12px 17px; color: white; background: var(--coral); box-shadow: 0 9px 20px rgba(239,91,77,.22); font-size: 12px; }
.primary-button:hover { background: var(--coral-dark); }
.button-arrow { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; background: rgba(255,255,255,.22); font-size: 16px; }

.preview-stage { position: sticky; top: 22px; min-height: 690px; padding: 23px 18px 18px; background: #e9e3d9; overflow: hidden; }
.preview-stage::before { content: ''; position: absolute; width: 180px; height: 180px; right: -80px; top: -80px; border-radius: 50%; background: rgba(244,189,50,.45); }
.preview-toolbar { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 0 8px 18px; }
.preview-toolbar h2 { font-size: 22px; }
.paper-size { background: rgba(255,255,255,.5); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
.receipt-paper { position: relative; z-index: 1; width: min(100mm, 100%); min-height: 120mm; margin: 0 auto; padding: 14px 18px 13px; overflow: hidden; background: var(--paper); color: #111820; box-shadow: 0 17px 28px rgba(24,31,36,.17); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 9px; line-height: 1.35; }
.receipt-header { display: flex; flex-direction: column; align-items: center; text-align: center; }
.receipt-logo { display: block; width: 32mm; height: 32mm; margin: -2px auto 3px; object-fit: contain; }
.receipt-header h2 { max-width: 100%; margin: 0; color: var(--navy); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 21px; line-height: 1; letter-spacing: -.04em; }
.receipt-tagline, .receipt-meta-line { max-width: 100%; margin: 4px 0 0; color: #67747d; font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.receipt-rule { height: 1px; margin: 9px 0; background: #17212b; opacity: .8; }
.receipt-rule.dotted { height: 0; border-top: 1px dashed #7d878d; background: none; }
.receipt-info, .receipt-customer, .receipt-total-row, .receipt-item-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.receipt-info { color: #57646d; font-size: 10.5px; }
.receipt-customer { display: block; margin-top: 5px; color: #57646d; font-size: 10.5px; }
.receipt-customer strong { color: #1b2730; }
.receipt-table { width: 100%; margin: 6px 0; border-collapse: collapse; table-layout: fixed; font-size: 10.5px; color: #1b2730; }
.receipt-table th { padding: 4px 0 5px; border-bottom: 1px solid #17212b; color: #5b6770; font-size: 9px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
.receipt-table td { padding: 4px 0; border-bottom: 1px dotted #b7c0c6; vertical-align: top; line-height: 1.35; }
.receipt-table tbody tr:last-child td { border-bottom: 1px solid #17212b; }
.receipt-table .c-no { width: 7%; text-align: center; }
.receipt-table .c-qty { width: 11%; text-align: center; }
.receipt-table .c-price { width: 23%; text-align: right; }
.receipt-table .c-total { width: 25%; text-align: right; font-weight: 700; }
.receipt-table .c-item { width: 34%; text-align: left; padding-left: 4px; padding-right: 3px; overflow-wrap: anywhere; }
.receipt-table th.c-item { padding-left: 4px; }
.receipt-table td.c-price, .receipt-table td.c-total, .receipt-table th.c-price, .receipt-table th.c-total { white-space: nowrap; }
.receipt-table td.c-item { font-weight: 700; }
.empty-receipt-row td { text-align: center; }
.receipt-total-row strong, .receipt-total-row span:last-child { white-space: nowrap; }
.empty-receipt-row { color: #a1adb5; font-style: italic; }
.receipt-total-row { margin-top: 4px; align-items: baseline; color: #57646d; font-size: 10.5px; }
.receipt-total-row strong { color: #18242d; }
.grand-total { margin-top: 8px; padding: 9px 10px; border-radius: 7px; background: var(--navy); color: white; font-size: 13px; font-weight: 900; }
.grand-total strong, .grand-total span { color: white; }
.change-row { color: var(--coral-dark); }
.change-row strong { color: var(--coral-dark); }
.receipt-note { display: grid; gap: 2px; margin-top: 10px; padding-top: 7px; border-top: 1px dashed #acb6bc; color: #57646d; font-size: 10.5px; }
.receipt-note span { white-space: pre-wrap; overflow-wrap: anywhere; }
.receipt-footer { display: grid; gap: 2px; margin-top: 16px; text-align: center; color: #7b878e; font-size: 9px; }
.receipt-footer strong { color: var(--navy); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; }
.preview-note { position: relative; z-index: 1; margin: 16px auto 0; max-width: 330px; color: #73818a; text-align: center; font-size: 10px; line-height: 1.45; }
.toast { position: fixed; z-index: 10; left: 50%; bottom: 24px; translate: -50% 16px; opacity: 0; pointer-events: none; padding: 11px 15px; border-radius: 10px; background: var(--navy); color: white; box-shadow: var(--shadow); font-size: 12px; font-weight: 700; transition: opacity .2s ease, translate .2s ease; }
.toast.show { translate: -50% 0; opacity: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

@media (max-width: 980px) {
  .app-shell { padding: 20px 16px 32px; }
  .workspace { grid-template-columns: 1fr; }
  .preview-stage { position: relative; top: 0; min-height: 0; }
}
@media (max-width: 620px) {
  .topbar, .topbar-actions, .panel-heading, .section-title-row { align-items: flex-start; flex-direction: column; }
  .topbar-actions { width: 100%; gap: 9px; }
  .status-pill, .ghost-button { width: 100%; justify-content: center; }
  .editor-panel { padding: 20px 15px; border-radius: 19px; }
  .two-col, .three-col { grid-template-columns: 1fr; }
  .items-table-head, .item-row { grid-template-columns: minmax(120px, 1.4fr) 54px minmax(92px, 1fr) 78px 25px; gap: 5px; }
  .items-table-head { font-size: 8px; padding: 0 5px; }
  .item-row { padding: 5px; }
  .item-row input { padding: 8px 7px; font-size: 11px; }
  .item-row output { font-size: 9px; }
  .action-row { flex-direction: column-reverse; }
  .secondary-button, .primary-button { width: 100%; justify-content: center; }
  .receipt-paper { width: 100mm; }
}

@media print {
  @page { size: 100mm 140mm; margin: 0; }
  html, body { width: 100mm; min-width: 100mm; margin: 0; background: white; }
  body * { visibility: hidden !important; }
  #receiptStage, #receiptStage * { visibility: visible !important; }
  #receiptStage { position: absolute; inset: 0 auto auto 0; display: block; width: 100mm; min-height: 120mm; padding: 0; background: white; overflow: visible; }
  #receiptStage::before, #receiptStage .preview-toolbar, #receiptStage .preview-note { display: none !important; }
  #receipt { width: 100mm; min-height: 120mm; margin: 0; padding: 5mm 5.5mm 4mm; box-shadow: none; }
  .receipt-logo { width: 28mm; height: 28mm; }
  .toast { display: none !important; }
}

  </style>

const STORAGE_KEY = 'almers-food-nota-v1';

const money = new Intl.NumberFormat('id-ID', {
  style: 'currency',
  currency: 'IDR',
  maximumFractionDigits: 0,
});

const numberFormat = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 });

function todayValue() {
  return new Date().toISOString().slice(0, 10);
}

function newReceiptNumber() {
  const stamp = todayValue().replaceAll('-', '');
  return `AF-${stamp.slice(2)}-01`;
}

function defaultState() {
  return {
    storeName: 'Almers Food',
    tagline: 'Lezat • Segar • Bersahabat',
    address: '',
    phone: '',
    receiptNo: newReceiptNumber(),
    date: todayValue(),
    customer: 'Umum',
    items: [{ name: '', qty: 1, price: 0 }],
    discount: 0,
    extra: 0,
    paid: 0,
    note: '',
  };
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && Array.isArray(saved.items)) return { ...defaultState(), ...saved };
  } catch (error) {
    console.info('Mode file lokal: draft otomatis dinonaktifkan pada browser ini.');
  }
  return defaultState();
}

let state = loadState();

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (error) {
    // Sebagian browser memblokir localStorage untuk file://; aplikasi tetap berjalan.
  }
}

function escapeHTML(value = '') {
  return String(value).replace(/[&<>'"]/g, (character) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;',
  }[character]));
}

function formatMoney(value) {
  return money.format(Math.max(0, Number(value) || 0)).replace(/\s/g, '');
}

function formatQuantity(value) {
  return numberFormat.format(Math.max(0, Number(value) || 0));
}

function formatDate(value) {
  if (!value) return '-';
  const date = new Date(`${value}T00:00:00`);
  return new Intl.DateTimeFormat('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }).format(date);
}

function itemTotal(item) {
  return Math.max(0, Number(item.qty) || 0) * Math.max(0, Number(item.price) || 0);
}

function totals() {
  const subtotal = state.items.reduce((sum, item) => sum + itemTotal(item), 0);
  const discount = Math.min(subtotal, Math.max(0, Number(state.discount) || 0));
  const extra = Math.max(0, Number(state.extra) || 0);
  const total = Math.max(0, subtotal - discount + extra);
  const paid = Math.max(0, Number(state.paid) || 0);
  return { subtotal, discount, extra, total, paid, change: Math.max(0, paid - total), remaining: Math.max(0, total - paid) };
}

function logoMarkup(className = 'receipt-logo') {
  return `<img class="${className}" src="${LOGO_SRC}" alt="Logo Almers Food" onerror="this.onerror=null;this.src='${LOGO_FALLBACK}'" />`;
}

document.querySelector('#app').innerHTML = appMarkup();

function syncFieldValues() {
  document.querySelectorAll('[data-field]').forEach((field) => {
    if (field.dataset.field === 'note') field.value = state.note || '';
    else field.value = state[field.dataset.field] ?? '';
  });
}

function renderItems() {
  const list = document.querySelector('#itemsList');
  list.innerHTML = state.items.map((item, index) => `
    <div class="item-row" data-index="${index}">
      <input data-item-field="name" data-index="${index}" type="text" value="${escapeHTML(item.name)}" placeholder="Contoh: Rice bowl" aria-label="Nama produk ${index + 1}" />
      <input class="qty-input" data-item-field="qty" data-index="${index}" type="number" min="0" step="1" value="${Number(item.qty) || 0}" aria-label="Jumlah ${index + 1}" />
      <input data-item-field="price" data-index="${index}" type="number" min="0" step="500" value="${Number(item.price) || 0}" aria-label="Harga per item ${index + 1}" />
      <output class="item-total">${formatMoney(itemTotal(item))}</output>
      <button class="remove-button" type="button" data-action="remove-item" data-index="${index}" aria-label="Hapus item ${index + 1}">×</button>
    </div>
  `).join('');
}

function renderReceipt() {
  const result = totals();
  const visibleItems = state.items.filter((item) => item.name.trim() || Number(item.qty) || Number(item.price));
  const itemRows = visibleItems.length ? visibleItems.map((item, i) => `
    <tr>
      <td class="c-no">${i + 1}</td>
      <td class="c-item">${escapeHTML(item.name || 'Item')}</td>
      <td class="c-qty">${formatQuantity(item.qty)}</td>
      <td class="c-price">${formatMoney(item.price)}</td>
      <td class="c-total">${formatMoney(itemTotal(item))}</td>
    </tr>
  `).join('') : '<tr class="empty-receipt-row"><td colspan="5">Belum ada item</td></tr>';
  const optionalMeta = [state.address, state.phone].filter(Boolean).map(escapeHTML).join('  •  ');
  const paidRow = result.paid > 0 ? `<div class="receipt-total-row"><span>Dibayar</span><strong>${formatMoney(result.paid)}</strong></div><div class="receipt-total-row change-row"><span>${result.remaining > 0 ? 'Kurang' : 'Kembalian'}</span><strong>${formatMoney(result.remaining > 0 ? result.remaining : result.change)}</strong></div>` : '';
  const note = state.note.trim() ? `<div class="receipt-note"><strong>Catatan</strong><span>${escapeHTML(state.note)}</span></div>` : '';
  document.querySelector('#receipt').innerHTML = `
    <div class="receipt-header">
      ${logoMarkup()}
      <h2>${escapeHTML(state.storeName || 'Almers Food')}</h2>
      <p class="receipt-tagline">${escapeHTML(state.tagline || '')}</p>
      ${optionalMeta ? `<p class="receipt-meta-line">${optionalMeta}</p>` : ''}
    </div>
    <div class="receipt-rule"></div>
    <div class="receipt-info"><span>No. ${escapeHTML(state.receiptNo || '-')}</span><span>${formatDate(state.date)}</span></div>
    <div class="receipt-customer">Pelanggan: <strong>${escapeHTML(state.customer || 'Umum')}</strong></div>
    <div class="receipt-rule dotted"></div>
    <table class="receipt-table">
      <thead><tr><th class="c-no">No</th><th class="c-item">Item</th><th class="c-qty">Qty</th><th class="c-price">Harga</th><th class="c-total">Total</th></tr></thead>
      <tbody>${itemRows}</tbody>
    </table>
    <div class="receipt-total-row"><span>Subtotal</span><strong>${formatMoney(result.subtotal)}</strong></div>
    ${result.discount ? `<div class="receipt-total-row"><span>Diskon</span><strong>− ${formatMoney(result.discount)}</strong></div>` : ''}
    ${result.extra ? `<div class="receipt-total-row"><span>Biaya tambahan</span><strong>+ ${formatMoney(result.extra)}</strong></div>` : ''}
    <div class="receipt-total-row grand-total"><span>TOTAL</span><strong>${formatMoney(result.total)}</strong></div>
    ${paidRow}
    ${note}
    <div class="receipt-footer"><strong>Terima kasih!</strong><span>Pesanan dibuat dengan hati.</span></div>
  `;
  document.querySelector('#liveTotal').textContent = formatMoney(result.total);
  const hint = document.querySelector('#paymentHint');
  if (result.paid === 0) hint.textContent = 'Masukkan nominal pembayaran untuk menghitung kembalian.';
  else if (result.remaining > 0) hint.textContent = `Masih kurang ${formatMoney(result.remaining)} dari total nota.`;
  else hint.textContent = `Kembalian pelanggan: ${formatMoney(result.change)}.`;
}

function showToast(message) {
  const toast = document.querySelector('#toast');
  toast.textContent = message;
  toast.classList.add('show');
  window.clearTimeout(showToast.timeout);
  showToast.timeout = window.setTimeout(() => toast.classList.remove('show'), 2200);
}

function resetTransaction() {
  const business = { storeName: state.storeName, tagline: state.tagline, address: state.address, phone: state.phone };
  state = { ...defaultState(), ...business };
  saveState();
  syncFieldValues();
  renderItems();
  renderReceipt();
  showToast('Nota baru siap diisi.');
}

document.addEventListener('input', (event) => {
  const field = event.target.closest('[data-field], [data-item-field]');
  if (!field) return;
  if (field.dataset.itemField) {
    const index = Number(field.dataset.index);
    const key = field.dataset.itemField;
    state.items[index][key] = key === 'name' ? field.value : Math.max(0, Number(field.value) || 0);
    const row = field.closest('.item-row');
    row.querySelector('.item-total').textContent = formatMoney(itemTotal(state.items[index]));
  } else {
    const key = field.dataset.field;
    state[key] = ['discount', 'extra', 'paid'].includes(key) ? Math.max(0, Number(field.value) || 0) : field.value;
  }
  saveState();
  renderReceipt();
});

document.addEventListener('click', (event) => {
  const button = event.target.closest('[data-action]');
  if (!button) return;
  const action = button.dataset.action;
  if (action === 'add-item') {
    state.items.push({ name: '', qty: 1, price: 0 });
    renderItems();
    saveState();
    renderReceipt();
    document.querySelector('#itemsList .item-row:last-child input')?.focus();
  }
  if (action === 'remove-item') {
    const index = Number(button.dataset.index);
    if (state.items.length > 1) state.items.splice(index, 1);
    else state.items[0] = { name: '', qty: 1, price: 0 };
    renderItems();
    saveState();
    renderReceipt();
  }
  if (action === 'new') resetTransaction();
  if (action === 'save') { saveState(); showToast('Draft nota tersimpan di perangkat ini.'); }
  if (action === 'print') { saveState(); window.print(); }
});

syncFieldValues();
renderItems();
renderReceipt();

  </script>
</body>
</html>
